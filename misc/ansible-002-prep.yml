---
- name: Ansible Final System Prep
  hosts: auto.loudwalrus.com
  vars:
    ansible_connection: ssh # ansible-core won't handle local properly
    key_src_dir: "/mnt/sync/ansible/ssh_keys"
    target_users:
      - ogren
      - ansible
  become: true
  run_once: true
  gather_facts: true

  tasks:

    - name: Add Standard content
      ansible.builtin.dnf:
        name: "ansible-core,git-core,sysstat"
        state: present

## Final content updates
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true

## Other Config
    - name: Add Ansible user
      ansible.builtin.user:
        state: present
        name: ansible
        password_lock: true
        generate_ssh_key: false
    - name: Add ansible user to sudoers
      ansible.builtin.lineinfile:
        state: present
        path: /etc/sudoers
        line: 'ansible ALL=(ALL:ALL) NOPASSWD:ALL'
        insertafter: '## Allow root to run any commands anywhere'
        validate: 'visudo -cf %s'
        
## Passwordless login setup (both so that we can passwordless login and so others can login to us)

    - name: Ensure .ssh directory exists for users
          ansible.builtin.file:
            path: "/home/{{ item }}/.ssh"
            state: directory
            owner: "{{ item }}"
            group: "{{ item }}"
            mode: '0700'
          loop: "{{ target_users }}"        
    
    - name: Copy authorized_keys
          ansible.builtin.copy:
            src: "{{ src_dir }}/authorized_keys"
            dest: "/home/{{ item }}/.ssh"
            owner: "{{ item }}"
            group: "{{ item }}"
            mode: '0600'
          loop: "{{ target_users }}"      

    - name: Copy config
          ansible.builtin.copy:
            src: "{{ src_dir }}/config"
            dest: "/home/{{ item.0 }}/.ssh"
            owner: "{{ item }}"
            group: "{{ item }}"
            mode: '0600'
          loop: "{{ target_users }}"      

    - name: Copy secret key
          ansible.builtin.copy:
            src: "{{ src_dir }}/ig_ogren_homelab"
            dest: "/home/{{ item.0 }}/.ssh"
            owner: "{{ item }}"
            group: "{{ item }}"
            mode: '0600'
          loop: "{{ target_users }}"      

      
 ## Reboot if needed       
    - name: Check to see if we need a reboot
      ansible.builtin.command: needs-restarting -r
      become: true
      register: needrestart_result
      failed_when: false # non-zero return just indicates reboot is needed
      changed_when: false

    - name: Reboot Server if Necessary
      ansible.builtin.reboot:
        msg: Ansible forcing reboot
        pre_reboot_delay: 3
      become: true
      when: needrestart_result.rc == 1
